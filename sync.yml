trigger:
  branches:
    include:
    - main

# Never build pull requests. Azure Pipelines builds every PR of a
# GitHub-bound pipeline by default, and a PR run checks out the PR's
# temporary test merge; the import must only ever take GitHub main. The
# shared sync template also refuses anything but main's tip.
pr: none

resources:
  repositories:
    - repository: templates
      type: git
      name: Plumbing/core-templates
    - repository: rollup-plugin-builder
      type: git
      name: Open/rollup-plugin-builder

stages:
- template: stages/sync/sync.yml@templates  # Template reference
  parameters:
    checkout: rollup-plugin-builder
    # GitHub-side merges auto-publish: the import commit carries no
    # [skip ci], so version-pack fires on community merges and dependency
    # bumps (Mike-approved 2026-09-13; the echo marker prevents ping-pong).
    skip_ci: false
